name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Repository code is tested with read-only access. Publishing authority is
# granted only to the no-checkout artifact and deployment jobs below.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Supersede stale PR checks, but never cancel a main deployment midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and build controls (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Compiler, workflow, and production-build controls
        run: npm run build

  browser:
    name: Production-browser behavior and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser behavior and accessibility gate
        run: npm run test:a11y

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain the tested site for a main publish only
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pages-artifact:
    name: Prepare Pages artifact
    if: github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      # This privileged job does not check out or execute repository code.
      - name: Download the tested production bundle
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site-dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. The complete test and browser gates must pass before a
  # patch or minor update can merge itself; majors stay open for human review.
  dependabot-auto-merge:
    name: Auto-merge gated non-major dependency updates
    needs: [test, browser]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave major updates for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major dependency updates are intentionally not auto-merged."

      - name: Merge a gated patch or minor update and request its deployment
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merged=
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              state=$(gh pr view "$PR_URL" --json state --jq .state)
              if [ "$state" = "MERGED" ]; then
                merged=1
                break
              fi
            fi
            echo "merge attempt $attempt did not land; retrying after base refresh"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the dependency PR did not merge"
            exit 1
          fi
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
